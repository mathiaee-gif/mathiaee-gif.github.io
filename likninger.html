<style>
body {

.meny {
  max-width: 1250px;
  margin: 0 auto 20px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0px 6px 15px rgba(0,0,0,0.12);
  overflow: hidden;
}

.meny summary {
  list-style: none;
  cursor: pointer;
  padding: 20px 25px;
  font-size: 26px;
  font-weight: bold;
  background: #4f46e5;
  color: white;
}

.meny summary::-webkit-details-marker {
  display: none;
}

.meny summary::after {
  content: "▼";
  float: right;
  font-size: 18px;
  transition: transform 0.2s ease;
}

.meny[open] summary::after {
  transform: rotate(180deg);
}

.meny-innhold {
  padding: 15px 25px 20px 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.meny-innhold a {
  text-decoration: none;
  color: #111827;
  background: #eef2ff;
  padding: 12px 16px;
  border-radius: 10px;
  transition: background 0.2s ease;
}


</style>
