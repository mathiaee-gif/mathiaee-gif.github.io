  <title>Likninger</title>


<h2>Likninger opplegg</h2>


<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f4f6;
  padding: 40px;
}

.meny {
  max-width: 1250px;
  margin: 0 auto 20px auto;
  background: white;
  border-radius: 16px;
  box-shadow: 0px 6px 15px rgba(0,0,0,0.12);
  overflow: hidden;
}

.meny summary {
  list-style: none;
  cursor: pointer;
  padding: 20px 25px;
  font-size: 26px;
  font-weight: bold;
  background: #4f46e5;
  color: white;
}

.meny summary::-webkit-details-marker {
  display: none;
}

.meny summary::after {
  content: "▼";
  float: right;
  font-size: 18px;
  transition: transform 0.2s ease;
}

.meny[open] summary::after {
  transform: rotate(180deg);
}

.meny-innhold {
  padding: 15px 25px 20px 25px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.meny-innhold a {
  text-decoration: none;
  color: #111827;
  background: #eef2ff;
  padding: 12px 16px;
  border-radius: 10px;
  transition: background 0.2s ease;
}


</style>
  
</head>

<body>

<div class="panel">
  
<button class="knapp" onclick="sjekkpassord().href='likning-L.html'">For lærere</button>
<button class="knapp" onclick="location.href='likning-e.html'">For elever</button>


<script>
function sjekkPassord() {
  let passord = prompt("Skriv inn passord:");

  if (passord === "Håndbok") {
    location.href = "likning-L.html";
  } else if (passord !== null) {
    alert("Feil passord.");
  }
}
</script>

  
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f3f4f6;
}

.panel {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
  height:40vh;
}

.knapp {
  padding:30px 40px;
  background:#4f46e5;
  color:white;
  text-decoration:none;
  border-radius:15px;
  font-size:28px;
  font-weight:bold;
  transition:all 0.2s ease;
  box-shadow:0px 4px 10px rgba(0,0,0,0.15);
}

.knapp:hover {
  background:#6366f1;
  transform:translateY(-5px);
  box-shadow:0px 10px 20px rgba(0,0,0,0.25);
}
</style>
